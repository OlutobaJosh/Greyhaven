<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle (optional, can be removed) -->
  <defs>
    <linearGradient id="greyHavenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main logo design: A modern house with a roof peak -->
  <g>
    <!-- House base/walls -->
    <rect x="50" y="85" width="100" height="70" rx="4" fill="#4a5568" />
    
    <!-- Roof (triangle) -->
    <polygon points="50,85 100,35 150,85" fill="#2d3748" />
    
    <!-- Roof accent line -->
    <line x1="100" y1="35" x2="100" y2="85" stroke="#6b8192" stroke-width="2" />
    
    <!-- Door -->
    <rect x="85" y="110" width="30" height="45" rx="2" fill="#1a202c" />
    <circle cx="112" cy="132" r="2.5" fill="#9ca3af" />
    
    <!-- Left window -->
    <rect x="60" y="95" width="20" height="20" rx="2" fill="#6b8192" />
    <line x1="70" y1="95" x2="70" y2="115" stroke="#1a202c" stroke-width="1" />
    <line x1="60" y1="105" x2="80" y2="105" stroke="#1a202c" stroke-width="1" />
    
    <!-- Right window -->
    <rect x="120" y="95" width="20" height="20" rx="2" fill="#6b8192" />
    <line x1="130" y1="95" x2="130" y2="115" stroke="#1a202c" stroke-width="1" />
    <line x1="120" y1="105" x2="140" y2="105" stroke="#1a202c" stroke-width="1" />
    
    <!-- Small accent windows on roof -->
    <circle cx="80" cy="60" r="4" fill="#6b8192" opacity="0.6" />
    <circle cx="120" cy="60" r="4" fill="#6b8192" opacity="0.6" />
  </g>
  
  <!-- Optional: Add text for variations -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');
  </style>
</svg>