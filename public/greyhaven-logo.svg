<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gh-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0873d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="50" cy="50" r="48" fill="#1a2e4a" opacity="0.1"/>
  
  <!-- House shape -->
  <g>
    <!-- Roof -->
    <polygon points="25,50 50,25 75,50" fill="url(#gh-gradient)"/>
    
    <!-- House body -->
    <rect x="25" y="50" width="50" height="35" rx="3" fill="#c9a84c"/>
    
    <!-- Door -->
    <rect x="43" y="62" width="14" height="23" rx="1" fill="#1a2e4a"/>
    
    <!-- Left window -->
    <rect x="30" y="58" width="8" height="8" rx="1" fill="#e2c47a"/>
    
    <!-- Right window -->
    <rect x="62" y="58" width="8" height="8" rx="1" fill="#e2c47a"/>
    
    <!-- Door handle -->
    <circle cx="56" cy="71" r="1.5" fill="#a0873d"/>
  </g>
</svg>